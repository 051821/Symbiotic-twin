system:
  profile: "fast"  # fast | paper
  num_edges: 3
  num_rounds: 10
  learning_rate: 0.0008
  batch_size: 512
  epochs_per_round: 1
  max_train_samples_per_round: 3072
  eval_every_n_rounds: 1
  eval_max_samples_per_round: 4096
  allow_extra_epochs: false
  dataloader_workers: 2
  seed: 42

server:
  host: "server"
  port: 8000

edges:
  - id: "edge1"
    device: "b8:27:eb:bf:9d:51"
    host: "127.0.0.1"
    port: 8001
  - id: "edge2"
    device: "00:0f:00:70:91:0a"
    host: "127.0.0.1"
    port: 8002
  - id: "edge3"
    device: "1c:bf:ce:15:ec:4d"
    host: "127.0.0.1"
    port: 8003

model:
  input_size: 7
  hidden_size: 80
  num_classes: 3
  dropout: 0.1
  weight_decay: 0.0001
  label_smoothing: 0.02
  grad_clip_norm: 1.0
  fedprox_mu: 0.0005

aggregation:
  strategy: "fedavg"
  adaptive_weighting: true
  reputation_enabled: true
  min_reputation: 0.1
  reputation_similarity_weight: 0.25

data:
  raw_path: "data/iot_telemetry_data.csv"
  processed_path: "data/processed/"
  partitions_path: "data/partitions/"
  test_split: 0.2
  test_split_mode: "temporal"  # temporal | stratified
  # Temporal sliding window — each round trains on a fresh time slice
  window_strategy: "sliding"      # sliding | expanding | full
  window_fraction: 0.22
  window_step: 0.06
  min_classes_per_window: 2

security:
  rate_limit_max_per_window: 30
  rate_limit_window_seconds: 60
  update_max_retries: 4
  update_retry_backoff_seconds: 1.0

logging:
  level: "INFO"
  log_dir: "logs/"
  format: "%(asctime)s | %(levelname)s | %(name)s | %(message)s"
  date_format: "%Y-%m-%d %H:%M:%S"

dashboard:
  refresh_interval: 3
  metrics_path: "logs/metrics.json"
