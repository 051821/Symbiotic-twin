system:
  profile: "fast"  # fast | paper
  num_edges: 3
  num_rounds: 10
  learning_rate: 0.0004
  batch_size: 512
  epochs_per_round: 1
  max_train_samples_per_round: 4096
  eval_every_n_rounds: 1
  eval_max_samples_per_round: 0
  allow_extra_epochs: false
  update_delivery_retries: 6
  update_delivery_wait_seconds: 2.0
  dataloader_workers: 0
  seed: 42

server:
  host: "server"
  port: 8000

edges:
  - id: "edge1"
    device: "b8:27:eb:bf:9d:51"
    host: "127.0.0.1"
    port: 8001
  - id: "edge2"
    device: "00:0f:00:70:91:0a"
    host: "127.0.0.1"
    port: 8002
  - id: "edge3"
    device: "1c:bf:ce:15:ec:4d"
    host: "127.0.0.1"
    port: 8003

model:
  input_size: 7
  hidden_size: 64
  num_classes: 3
  dropout: 0.05
  weight_decay: 0.0001
  label_smoothing: 0.01
  grad_clip_norm: 1.0
  fedprox_mu: 0.0005
  rule_prior_enabled: true
  rule_prior_strength: 3.0
  rule_prior_scaled_input: false
  rule_prior_margins: [0.00003, 0.00003, 0.00003, 0.3]

aggregation:
  strategy: "fedavg"
  adaptive_weighting: true
  reputation_enabled: true
  min_reputation: 0.1
  reputation_similarity_weight: 0.2
  reputation_ema_alpha: 0.3
  aggregation_reputation_power: 0.75

data:
  raw_path: "data/iot_telemetry_data.csv"
  processed_path: "data/processed/"
  partitions_path: "data/partitions/"
  features_scaled: false
  test_split: 0.2
  test_split_mode: "stratified"  # temporal | stratified
  # Temporal sliding window — each round trains on a fresh time slice
  window_strategy: "expanding"      # sliding | expanding | full
  window_fraction: 0.45
  window_step: 0.08
  min_classes_per_window: 2
  min_samples_per_class_cap: 192
  class_balance_cap_fraction: 0.1
  oversample_rare_classes: false
  calibration_samples_per_class: 384
  class_weight_multipliers: [1.0, 1.05, 1.45]

security:
  rate_limit_max_per_window: 30
  rate_limit_window_seconds: 60
  update_max_retries: 4
  update_retry_backoff_seconds: 1.0

logging:
  level: "INFO"
  log_dir: "logs/"
  format: "%(asctime)s | %(levelname)s | %(name)s | %(message)s"
  date_format: "%Y-%m-%d %H:%M:%S"

dashboard:
  refresh_interval: 3
  metrics_path: "logs/metrics.json"
